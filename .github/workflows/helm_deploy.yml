name: Helm Deploy to ArgoCD

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true            # Name of the application (for commit message)

      values_path:
        type: string
        required: true            # Path to Helm values file (inside infra repo)

      image_name:
        type: string
        required: true            # Docker image name (without registry)

      image_tag:
        type: string
        required: true            # Tag returned from CI

      helm_repo:
        type: string
        required: false
        default: "eranin/eranin-infra"   # Infra repo that stores all deployments

      # Ceiling for the deploy job. This one runs on ubuntu-latest, so a hang
      # burns hosted minutes rather than holding our shared self-hosted node —
      # lower stakes than the eranin-ci jobs, but still worth bounding.
      #
      # Measured across 160 successful deploys in 7 caller repos: median 7s,
      # p90 9s, slowest 13s. The job only rewrites one values file and pushes.
      # 10 minutes is far above anything observed while still leaving room for
      # the push retry/backoff loop, whose unreachable-remote path gives up in
      # about a minute. See ERA-207.
      timeout_minutes:
        description: Ceiling for the deploy job.
        type: number
        default: 10

    secrets:
      INFRA_REPO_TOKEN:
        required: true           # Token with write access to infra repo

      IMAGE_REGISTRY:
        required: true           # Registry host

jobs:
  deploy:
    # Self-hosted: GitHub-hosted minutes are capped by the org Actions budget
    # ($10, stop-on-limit). Once it is spent every hosted job is refused before
    # it starts, which halted every deploy on 2026-09-29.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:

      # ------------------------------------------------------------
      # 1) Checkout infrastructure repository (ArgoCD GitOps repo)
      # ------------------------------------------------------------
      # v5 = the Node 24 runtime (v4 targets Node 20 and now warns). Needs runner
      # >= 2.327.1; this job runs on the self-hosted runner. Inputs unchanged.
      - name: Checkout Infra Repo
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.helm_repo }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2) Install YQ (safe + deterministic install method)
      # ------------------------------------------------------------
      - name: Install yq
        run: |
          # The self-hosted runner has no passwordless sudo, so install into a
          # job-local bin dir rather than /usr/bin. Reuse a host copy if present.
          if command -v yq >/dev/null 2>&1 && yq --version | grep -q mikefarah; then
            echo "yq already present: $(yq --version)"
          else
            mkdir -p "$RUNNER_TEMP/bin"
            curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$RUNNER_TEMP/bin/yq"
            chmod +x "$RUNNER_TEMP/bin/yq"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/bin/yq" --version
          fi

      # ------------------------------------------------------------
      # 3) Patch Helm values.yaml with new image repository + tag
      # ------------------------------------------------------------
      - name: Update Helm Values
        run: |
          FILE="${{ inputs.values_path }}"
          REG="${{ secrets.IMAGE_REGISTRY }}"
          NAME="${{ inputs.image_name }}"
          TAG="${{ inputs.image_tag }}"

          echo "Updating Helm values file: $FILE"
          echo " -> repository: $REG/$NAME"
          echo " -> tag:        $TAG"

          # Inject image repo + tag into Helm chart values
          yq -i ".deployment.image.repository = \"${REG}/${NAME}\"" "$FILE"
          yq -i ".deployment.image.tag = \"${TAG}\"" "$FILE"

          echo "---- Updated file content ----"
          cat "$FILE"
          echo "------------------------------"

      # ------------------------------------------------------------
      # 4) Commit & push changes (only if file was modified)
      # ------------------------------------------------------------
      - name: Commit & Push
        run: |
          git config user.email "cd-bot@eranin.dev"
          git config user.name "Eranin-CD-Bot"
          
          git add .

          # No commit if file has no changes
          if git diff --cached --quiet; then
            echo "No changes to commit. Deployment skipped."
            exit 0
          fi

          git commit -m "CD: Update ${{ inputs.app_name }} → tag ${{ inputs.image_tag }}"
          git push

      # ------------------------------------------------------------
      # 5) Summary for GitHub Actions UI
      # ------------------------------------------------------------
      - name: Summary
        run: |
          echo "CD updated image:" >> $GITHUB_STEP_SUMMARY
          echo "**${{ secrets.IMAGE_REGISTRY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}**" >> $GITHUB_STEP_SUMMARY

