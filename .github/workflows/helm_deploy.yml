name: Helm Deploy to ArgoCD

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true            # Name of the application (for commit message)

      values_path:
        type: string
        required: true            # Path to Helm values file (inside infra repo)

      image_name:
        type: string
        required: true            # Docker image name (without registry)

      image_tag:
        type: string
        required: true            # Tag returned from CI

      helm_repo:
        type: string
        required: false
        default: "eranin/eranin-infra"   # Infra repo that stores all deployments

    secrets:
      INFRA_REPO_TOKEN:
        required: true           # Token with write access to infra repo

      IMAGE_REGISTRY:
        required: true           # Registry host

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1) Checkout infrastructure repository (ArgoCD GitOps repo)
      # ------------------------------------------------------------
      # v5 = the Node 24 runtime (v4 targets Node 20 and now warns). Needs runner
      # >= 2.327.1; this job is on GitHub-hosted ubuntu-latest. Inputs unchanged.
      - name: Checkout Infra Repo
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.helm_repo }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2) Install YQ (safe + deterministic install method)
      # ------------------------------------------------------------
      - name: Install yq
        run: |
          sudo curl -L \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" \
            -o /usr/bin/yq

          sudo chmod +x /usr/bin/yq
          echo "yq installed version:"
          /usr/bin/yq --version

      # ------------------------------------------------------------
      # 3) Patch Helm values.yaml with new image repository + tag
      # ------------------------------------------------------------
      - name: Update Helm Values
        run: |
          FILE="${{ inputs.values_path }}"
          REG="${{ secrets.IMAGE_REGISTRY }}"
          NAME="${{ inputs.image_name }}"
          TAG="${{ inputs.image_tag }}"

          echo "Updating Helm values file: $FILE"
          echo " -> repository: $REG/$NAME"
          echo " -> tag:        $TAG"

          # Inject image repo + tag into Helm chart values
          /usr/bin/yq -i ".deployment.image.repository = \"${REG}/${NAME}\"" "$FILE"
          /usr/bin/yq -i ".deployment.image.tag = \"${TAG}\"" "$FILE"

          echo "---- Updated file content ----"
          cat "$FILE"
          echo "------------------------------"

      # ------------------------------------------------------------
      # 4) Commit & push changes (only if file was modified)
      # ------------------------------------------------------------
      - name: Commit & Push
        run: |
          git config user.email "cd-bot@eranin.dev"
          git config user.name "Eranin-CD-Bot"
          
          git add .

          # No commit if file has no changes
          if git diff --cached --quiet; then
            echo "No changes to commit. Deployment skipped."
            exit 0
          fi

          git commit -m "CD: Update ${{ inputs.app_name }} → tag ${{ inputs.image_tag }}"

          # Every app's CD job writes this one shared infra repo, so a bare push
          # has two ways to lose a race it did nothing wrong to deserve:
          #
          #   1. Two deploys finishing together. A repo whose workflow builds a
          #      frontend and a backend runs both deploy jobs in parallel; they
          #      commit to the same branch and the slower push is rejected as
          #      non-fast-forward.
          #   2. GitHub returning a transient 500. Observed on stj-website run
          #      36013387906 (2026-09-24): "remote: Internal Server Error" and
          #      "! [remote rejected] main -> main", with the commit created
          #      locally just fine.
          #
          # Both surface on this single line and both turn a good build into a
          # red customer-facing pipeline, so retry instead of failing. Rebasing
          # is safe here because this job's only commit touches the one values
          # file named by inputs.values_path, which no other job writes.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"

          for attempt in 1 2 3 4 5; do
            if git push origin "$BRANCH"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              break
            fi

            # Back off a little further each time: a concurrent push clears in
            # seconds, a GitHub blip can take longer.
            echo "Push failed (attempt ${attempt}/5). Syncing with origin/${BRANCH} and retrying..."
            sleep $(( attempt * 5 ))

            # Fetch and rebase are kept apart so the failure message names the
            # real problem. A fetch that fails is the remote being unreachable
            # — the same transient class as the push itself, so keep retrying.
            if ! git fetch origin "$BRANCH"; then
              echo "Could not reach origin to sync (attempt ${attempt}/5)."
              continue
            fi

            if ! git rebase "origin/${BRANCH}"; then
              # A conflict means something else rewrote the very values this job
              # is updating. That is not a race to retry through — leave the
              # tree clean, stop, and let a human look rather than force over it.
              git rebase --abort || true
              echo "::error::Rebase onto origin/${BRANCH} conflicted — another commit changed the same values file this job updates. Refusing to force. Deployment not pushed."
              exit 1
            fi
          done

          echo "::error::Could not push to ${{ inputs.helm_repo }} after 5 attempts. Deployment not pushed."
          exit 1

      # ------------------------------------------------------------
      # 5) Summary for GitHub Actions UI
      # ------------------------------------------------------------
      - name: Summary
        run: |
          echo "CD updated image:" >> $GITHUB_STEP_SUMMARY
          echo "**${{ secrets.IMAGE_REGISTRY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}**" >> $GITHUB_STEP_SUMMARY

